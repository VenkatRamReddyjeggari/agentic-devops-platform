# Weekly dependency updates as pull requests; CI must pass before they merge.
# Minor and patch bumps are grouped per ecosystem to keep the PR count low.
version: 2
updates:
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: terraform
    directories:
      - /terraform/bootstrap
      - /terraform/envs/dev
      - /terraform/envs/prod
      - /terraform/modules/*
    schedule:
      interval: weekly
    groups:
      terraform:
        update-types: [minor, patch]
