# Weekly dependency updates.
#
# Policy: Dependabot proposes only what CI can prove.
# - pip: unit tests cover the code and scripts/smoke-test.sh starts the real
#   gunicorn server, so every update is testable. Minor/patch come as one grouped
#   PR; majors come as separate PRs so one breaking major can't block the rest.
# - GitHub Actions: grouped, majors included; CI runs the new versions itself.
# - Terraform and the Python base image: CI only validates syntax, so major
#   upgrades need a deliberate change with a reviewed plan. They are capped with
#   explicit version ceilings: `update-types: semver-major` alone did not stop
#   requirement-range bumps like `~> 5.0` -> `~> 6.68` (see PR #27).
# Security updates for vulnerable packages are separate and not affected.
version: 2
updates:
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
    ignore:
      # Move to a new Python release together with CI and release.yml (3.12 today).
      - dependency-name: python
        versions: [">= 3.13"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /terraform/bootstrap
      - /terraform/envs/dev
      - /terraform/envs/prod
      - /terraform/modules/*
    schedule:
      interval: weekly
    ignore:
      - dependency-name: hashicorp/aws
        versions: [">= 6.0.0"]
      - dependency-name: hashicorp/helm
        versions: [">= 3.0.0"]
      - dependency-name: terraform-aws-modules/eks/aws
        versions: [">= 21.0.0"]
      - dependency-name: terraform-aws-modules/vpc/aws
        versions: [">= 6.0.0"]
    groups:
      terraform:
        patterns: ["*"]
