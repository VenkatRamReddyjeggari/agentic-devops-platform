# Weekly dependency updates, grouped into one PR per ecosystem.
#
# Policy: Dependabot proposes only what CI can prove.
# - Major versions of Python packages, Terraform providers/modules and the Python
#   base image are ignored: they need a deliberate upgrade (and, for Terraform, a
#   reviewed plan against a live environment). Security updates still arrive for
#   vulnerable packages via Dependabot security updates.
# - GitHub Actions updates, majors included, are grouped: CI runs the new versions,
#   so a green PR proves them.
version: 2
updates:
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /app
    schedule:
      interval: weekly
    ignore:
      # Python 3.12 -> 3.13 is a "minor" bump in image tags; change it together
      # with CI and the release workflow, not on its own.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /terraform/bootstrap
      - /terraform/envs/dev
      - /terraform/envs/prod
      - /terraform/modules/*
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      terraform:
        patterns: ["*"]
