name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements-dev.txt ruff
      - run: ruff check app/
      - run: cd app && pytest -q
      - name: Server smoke test (runs the Dockerfile's CMD)
        run: bash scripts/smoke-test.sh

  terraform:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        root: [envs/dev, envs/prod, envs/live-test, bootstrap]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive terraform/
      - run: terraform -chdir=terraform/${{ matrix.root }} init -backend=false
      - run: terraform -chdir=terraform/${{ matrix.root }} validate

  helm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - run: helm lint charts/orders-api
      - name: Render and validate (dev + prod)
        run: |
          helm template orders-api charts/orders-api > dev.yaml
          helm template orders-api charts/orders-api -f charts/orders-api/values-prod.yaml > prod.yaml
          kubeconform -strict -summary dev.yaml prod.yaml
      - name: Team policy checks (same script the Claude skill uses)
        run: |
          bash .claude/skills/k8s-manifest-review/scripts/check-manifests.sh dev.yaml
          bash .claude/skills/k8s-manifest-review/scripts/check-manifests.sh prod.yaml

  claude-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck hooks
        run: shellcheck .claude/hooks/*.sh .claude/skills/*/scripts/*.sh scripts/*.sh
      - name: Hook behavior tests
        run: bash tests/test_hooks.sh
      - name: Plugin is in sync with .claude/
        run: bash scripts/build-plugin.sh && git diff --exit-code plugin/

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Pinned by commit SHA (v0.36.0); unprefixed tags like 0.28.0 no longer exist.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          skip-dirs: "**/.terraform"
          severity: HIGH,CRITICAL
          exit-code: "1"
