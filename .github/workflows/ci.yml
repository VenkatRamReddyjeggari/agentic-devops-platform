name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r app/requirements.txt ruff
      - run: ruff check app/
      - run: cd app && pytest -q

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive terraform/
      - run: terraform -chdir=terraform/envs/${{ matrix.env }} init -backend=false
      - run: terraform -chdir=terraform/envs/${{ matrix.env }} validate

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - run: helm lint charts/orders-api
      - name: Render and validate (dev + prod)
        run: |
          helm template orders-api charts/orders-api > dev.yaml
          helm template orders-api charts/orders-api -f charts/orders-api/values-prod.yaml > prod.yaml
          kubeconform -strict -summary dev.yaml prod.yaml
      - name: Team policy checks (same script the Claude skill uses)
        run: |
          bash .claude/skills/k8s-manifest-review/scripts/check-manifests.sh dev.yaml
          bash .claude/skills/k8s-manifest-review/scripts/check-manifests.sh prod.yaml

  claude-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shellcheck hooks
        run: shellcheck .claude/hooks/*.sh .claude/skills/*/scripts/*.sh scripts/*.sh
      - name: Hook behavior tests
        run: bash tests/test_hooks.sh
      - name: Plugin is in sync with .claude/
        run: bash scripts/build-plugin.sh && git diff --exit-code plugin/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
