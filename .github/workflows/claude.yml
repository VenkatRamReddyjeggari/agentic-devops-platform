# Mention @claude in a PR or issue comment to run Claude Code in CI.
# It loads this repo's CLAUDE.md, skills, subagents and hooks, so the same
# guardrails apply in CI as on a laptop.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    # Public repo: only the owner and collaborators may start a run, so strangers
    # can't spend the API key or get a token with write access. (The action also
    # checks the commenter's permission; this is a second, earlier lock.)
    if: >-
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
