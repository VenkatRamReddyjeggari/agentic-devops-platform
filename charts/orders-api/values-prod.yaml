# PRODUCTION overrides. Edits require human approval (protect-prod hook).
replicaCount: 3

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 12
  targetCPUUtilizationPercentage: 65

podDisruptionBudget:
  enabled: true
  minAvailable: 2

# Must match terraform/envs/prod output orders_table_name. The IRSA role ARN
# carries the account ID, so it is passed at deploy time, not stored here.
ordersTable:
  name: platform-prod-orders
