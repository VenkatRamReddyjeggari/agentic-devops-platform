# Dev defaults. Prod overrides live in values-prod.yaml (protected by hooks).
replicaCount: 1

image:
  repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/orders-api
  tag: "0.1.0"            # CI overrides with the git SHA
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  annotations: {}         # eks.amazonaws.com/role-arn: <IRSA role ARN>

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1

env:
  APP_VERSION: "0.1.0"
